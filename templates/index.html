<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ComicCraft - AI Comic Story Creator</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="container">
    <h1>🎨 ComicCraft</h1>
    <p class="subtitle">Create your own AI-powered comic story.</p>

    <form action="/generate" method="post">
        <label>Story Prompt</label>
        <textarea name="story_prompt" required placeholder="A brave fox exploring an enchanted forest"></textarea>

        <label>Main Character Name</label>
        <input name="character_name" required placeholder="Finn">

        <label>Setting</label>
        <select name="setting">
            <option>Forest</option>
            <option>School</option>
            <option>City</option>
            <option>Space</option>
            <option>Fantasy Kingdom</option>
        </select>

        <label>Story Tone</label>
        <select name="tone">
            <option>Funny</option>
            <option>Light-hearted</option>
            <option>Dramatic</option>
            <option>Poetic</option>
            <option>Adventure</option>
        </select>

        <label>Art Style</label>
        <select name="art_style">
            <option>Comic book</option>
            <option>Anime</option>
            <option>Pixel art</option>
            <option>Realistic</option>
        </select>

        <button type="submit">✨ Generate Comic</button>
    </form>

    <p class="hint">First generation can take several minutes because Stable Diffusion runs locally.</p>
</div>
</body>
</html>
